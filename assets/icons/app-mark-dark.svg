     faces, so the bytes below are identical to the package's tray-dark-source-16-quiet.svg. The dark
     set's colours as mark.svg already carries them: the cream check #FFF3DA, the hollow pink ring
     #FF6AC8. Since 2026-09-08 the app icon is the mark alone, no tile, in the dark colours. -->
