<text x="76" y="45" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#EAEDF5" text-anchor="start">AskerDo: the parts and how a question travels</text><rect x="20" y="80" width="600" height="520" rx="16" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.12)"/><text x="40" y="108" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#626B80" text-anchor="start">THIS PC</text><rect x="40" y="122" width="560" height="150" rx="14" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.22)"/><text x="60" y="150" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#EAEDF5" text-anchor="start">Claude Code session, with the plugin</text><rect x="56" y="166" width="250" height="92" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.12)"/><text x="72" y="192" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#EAEDF5" text-anchor="start">Mod</text><text x="72" y="214" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">band, status line, pane,</text><text x="72" y="233" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">the ask, decide and handoff tools</text><text x="72" y="250" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4CC9FF" text-anchor="start">hooks/mod/</text><rect x="322" y="166" width="262" height="92" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.12)"/><text x="338" y="192" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#EAEDF5" text-anchor="start">Output style</text><text x="338" y="214" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">generated by lib/builder.js,</text><text x="338" y="233" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">written by the SessionStart sync</text><text x="338" y="250" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4CC9FF" text-anchor="start">hooks/sync.mjs</text><rect x="40" y="340" width="560" height="140" rx="14" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.22)"/><text x="60" y="368" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#EAEDF5" text-anchor="start">Local server</text><text x="170" y="368" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4CC9FF" text-anchor="start">hooks/board-server.mjs on askerdo.localhost</text><text x="60" y="396" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">a cache of the board, fed by the event stream; reads come from it</text><text x="60" y="416" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">runs CLI verbs in process; every write goes on to the board</text><text x="60" y="436" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">an answer inbox per session, and the alerts the tray draws</text><text x="60" y="456" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">started at logon by a per-user scheduled task</text><rect x="40" y="510" width="380" height="70" rx="14" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.22)"/><text x="60" y="536" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#EAEDF5" text-anchor="start">CLI</text><text x="96" y="536" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4CC9FF" text-anchor="start">bin/askerdo.mjs</text><text x="60" y="560" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">askerdo &lt;verb&gt;: one call to the local server</text><rect x="440" y="510" width="160" height="70" rx="14" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.22)"/><text x="456" y="536" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#EAEDF5" text-anchor="start">Tray</text><text x="496" y="536" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#626B80" text-anchor="start">Windows</text><text x="456" y="560" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">alerts, menu, opener</text><rect x="680" y="80" width="300" height="400" rx="16" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.12)"/><text x="700" y="108" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#626B80" text-anchor="start">THE BOARD, ONE FOR EVERY PC</text><rect x="696" y="122" width="268" height="344" rx="14" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.22)"/><text x="716" y="150" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#EAEDF5" text-anchor="start">Board server</text><text x="716" y="170" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4CC9FF" text-anchor="start">server/ in Docker, port 17480</text><text x="716" y="202" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">One Node process,</text><text x="716" y="221" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#EAEDF5" text-anchor="start">one SQLite file</text><text x="716" y="254" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">Issues every label:</text><text x="716" y="273" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#EAEDF5" text-anchor="start">Q, WS-, TR-, T-, K-</text><text x="716" y="306" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">Verbs:</text><text x="716" y="325" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#EAEDF5" text-anchor="start">POST /api/v1/verbs/&lt;name&gt;</text><text x="716" y="358" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9BA3B5" text-anchor="start">Event stream:</text><text x="716" y="377" font-family="Geist, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#EAEDF5" text-anchor="start">GET /api/v1/events</text><text x="716" y="410" font-fa